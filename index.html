<html>

<head>
    <meta charset="utf-8">
    <title>Combine PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">
        <header class="intro">
            <span class="eyebrow">Local tool &middot; no upload leaves your machine</span>
            <h1>Combine PDF</h1>
            <p class="sub">Add your PDFs, arrange them in the order you want them bound, then merge into one file.</p>
        </header>

        <div class="card" id="card">
            <div id="notice-slot"></div>

            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Add PDF files">
                <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7 3.5Z"/>
                    <path d="M14 3.5V8h4.2"/>
                    <path d="M9 13.2h6M9 16.4h4.2"/>
                </svg>
                <div class="dz-title">Drop PDFs here, or <span class="accent-word">browse files</span></div>
                <div class="dz-hint">You can add more at any point before merging</div>
                <input type="file" id="file-input" accept="application/pdf" multiple aria-hidden="true" tabindex="-1">
            </div>

            <ul class="filelist" id="filelist"></ul>

            <div class="card-footer">
                <span class="status-line" id="status-line">No files yet</span>
                <button class="btn btn-primary" id="merge-btn" disabled>Choose at least 2 PDFs</button>
            </div>

            <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/scripts.js"></script>
</body>

</html>
